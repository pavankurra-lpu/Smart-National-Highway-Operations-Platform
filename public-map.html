<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNHOP - Public Traffic Map</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #0f172a; color: #fff; font-family: 'Inter', sans-serif; }
        #public-map { width: 100%; height: 100%; }
        .header { position: absolute; top: 0; left: 0; width: 100%; padding: 15px 20px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); z-index: 1000; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .brand { font-size: 18px; font-weight: 800; letter-spacing: 1px; color: #64ffda; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
        .nav-btn { color: #fff; text-decoration: none; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 6px; transition: 0.3s; }
        .nav-btn:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand"><i class="fa-solid fa-satellite-dish"></i> SNHOP Public Traffic & Toll Map</div>
        <a href="index.html" class="nav-btn"><i class="fa-solid fa-arrow-left"></i> Back to Gateway</a>
    </div>

    <div id="public-map"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="js/shared/tollSeedData.js"></script>
    <script src="js/shared/storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const map = L.map('public-map', { zoomControl: false }).setView([22.5937, 78.9629], 5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            }).addTo(map);

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Render Tolls
            const tollStates = Storage.get(Storage.KEYS.TOLL_STATES, {});
            let rendered = 0;
            if (window.TollSeedData) {
                TollSeedData.forEach(toll => {
                    if (rendered > 300 || !toll.lat || !toll.lng) return;
                    const congestion = tollStates[toll.id]?.congestion || 'NORMAL';
                    const colors = { NORMAL: '#00e5b3', MODERATE: '#fbbf24', HIGH: '#ff4d6d' };
                    const cc = colors[congestion];
                    
                    const icon = L.divIcon({
                        className: '',
                        html: `<div style='background:${cc};width:8px;height:8px;border-radius:50%;border:1px solid #000;box-shadow:0 0 5px ${cc};'></div>`,
                        iconSize: [8,8], iconAnchor: [4,4]
                    });
                    
                    L.marker([toll.lat, toll.lng], { icon })
                        .bindPopup(`<b>${toll.name}</b><br>State: ${toll.state}<br>Congestion: <span style="color:${cc};font-weight:bold;">${congestion}</span>`)
                        .addTo(map);
                    rendered++;
                });
            }

            // Render active vehicles
            const positions = Storage.get('nhai_live_positions', {});
            Object.keys(positions).forEach(tripId => {
                const data = positions[tripId];
                const icon = L.divIcon({
                    className: '',
                    html: `<div style="background:#3b82f6; width:12px; height:12px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 10px #3b82f6;"></div>`,
                    iconSize: [12, 12], iconAnchor: [6, 6]
                });
                L.marker([data.lat, data.lng], { icon })
                    .bindPopup(`Active Vehicle on Route`)
                    .addTo(map);
            });
        });
    </script>
</body>
</html>
