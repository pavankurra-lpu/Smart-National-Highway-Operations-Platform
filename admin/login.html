<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNHOP Admin Secure Login</title>
    <!-- Use same global styles for baseline -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="admin-login-body">

    <div class="glass-panel login-card" style="width: 100%; max-width: 400px; text-align: center; border-color: var(--border);">
        <i class="fa-solid fa-building-shield fa-3x" style="color: var(--primary); margin-bottom: 20px;"></i>
        <h2 style="margin-bottom: 10px; color: #fff;">AUTHORIZED PERSONNEL ONLY</h2>
        <p style="font-size: 12px; margin-bottom: 30px;">SNHOP Operations Control Room</p>

        <form id="login-form" class="flex-col gap-4">
            <div style="text-align: left;">
                <label style="font-size: 11px; color: var(--text-sec); font-weight: bold;">STAFF ID</label>
                <input type="text" id="admin-id" placeholder="admin@nhai" required autocomplete="off">
            </div>
            
            <div style="text-align: left;">
                <label style="font-size: 11px; color: var(--text-sec); font-weight: bold;">PASSCODE</label>
                <input type="password" id="admin-pass" placeholder="NHAI@2026" required autocomplete="off">
            </div>

            <div style="text-align: left;">
                <label style="font-size: 11px; color: var(--text-sec); font-weight: bold;">ASSIGNED TOLL PLAZA</label>
                <select id="admin-plaza" required style="width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 13px; margin-top: 5px; outline: none; appearance: auto;">
                    <option value="ALL">All Plazas (Super Admin)</option>
                    <option value="Lakshmipur">Lakshmipur Plaza (Punjab)</option>
                    <option value="Aganampudi">Aganampudi Plaza (Andhra Pradesh)</option>
                    <option value="Bandra-Worli">Bandra-Worli Plaza (Maharashtra)</option>
                    <option value="Yamuna Expressway">Yamuna Expressway (Delhi NCR)</option>
                    <option value="Electronic City">Electronic City Plaza (Karnataka)</option>
                </select>
            </div>

            <p id="login-error" style="color: var(--accent-red); font-size: 12px; height: 14px; margin: 0;"></p>

            <button type="submit" class="btn btn-primary w-full" style="justify-content: center; padding: 15px;">
                <i class="fa-solid fa-lock-open"></i> AUTHENTICATE
            </button>
        </form>

        <div style="margin-top: 30px; font-size: 10px; color: var(--text-sec);">
            <p>Authorized Personnel Only - Refer to Internal Documentation for access.</p>
            <p style="margin-top: 5px; color: var(--primary);">Demo Creds: admin@nhai / NHAI@2026</p>
        </div>
        <a href="../index.html" style="display:inline-block; margin-top: 15px; font-size: 12px; color: var(--text-sec); text-decoration: none;">← Back to Gateway</a>
    </div>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/shared/auth.js"></script>
    <script src="../js/admin/login.js"></script>
    <!-- Motion.dev Animation Library -->
    <script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js"></script>
    <script src="../js/shared/animations.js"></script>
</body>
</html>
