<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNHOP Admin Secure Login</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="admin-login-body" style="background: #09090b; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif;">

    <div class="glass-panel login-card" style="width: 100%; max-width: 480px; text-align: center; border: 1px solid rgba(255,255,255,0.08); padding: 32px 28px; background: rgba(18, 18, 23, 0.95); backdrop-filter: blur(28px); border-radius: 20px; box-shadow: 0 24px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.08);">
        <div style="width: 50px; height: 50px; border-radius: 12px; background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.25); display: inline-flex; align-items: center; justify-content: center; color: #38bdf8; font-size: 20px; margin-bottom: 14px;">
            <i class="fa-solid fa-building-shield"></i>
        </div>
        <h2 style="margin-bottom: 4px; color: #ffffff; font-size: 18px; font-weight: 800; letter-spacing: -0.01em;">HIGHWAY OPERATIONS COMMAND</h2>
        <p style="font-size: 11.5px; margin-bottom: 16px; color: #a1a1aa;">NHAI Operations Command Center</p>

        <!-- Quick Credential Autofill Pill -->
        <button type="button" onclick="document.getElementById('admin-id').value='admin@nhai'; document.getElementById('admin-pass').value='NHAI@2026';" style="display: inline-flex; align-items: center; gap: 6px; background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 9999px; padding: 5px 12px; font-size: 11px; color: #38bdf8; font-weight: 600; cursor: pointer; margin-bottom: 18px; transition: all 0.2s;" onmouseover="this.style.background='rgba(56,189,248,0.15)';" onmouseout="this.style.background='rgba(56,189,248,0.08)';">
            <i class="fa-solid fa-key" style="font-size: 10px;"></i> Auto-Fill Demo Pass: <span style="font-family: monospace; font-weight: 700;">admin@nhai / NHAI@2026</span>
        </button>

        <form id="login-form" class="flex-col gap-3">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left;">
                <div>
                    <label style="font-size: 10.5px; color: #a1a1aa; font-weight: 700; letter-spacing: 0.5px;">STAFF ID</label>
                    <input type="text" id="admin-id" value="admin@nhai" placeholder="admin@nhai" required autocomplete="username" style="width:100%; box-sizing:border-box; padding:10px 12px; margin-top:4px; font-size:12px; background:#18181b; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#fff; outline:none;">
                </div>
                <div>
                    <label style="font-size: 10.5px; color: #a1a1aa; font-weight: 700; letter-spacing: 0.5px;">PASSCODE</label>
                    <input type="password" id="admin-pass" value="NHAI@2026" placeholder="NHAI@2026" required autocomplete="current-password" style="width:100%; box-sizing:border-box; padding:10px 12px; margin-top:4px; font-size:12px; background:#18181b; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#fff; outline:none;">
                </div>
            </div>

            <!-- DIRECT STATE & DISTRICT TOLL PICKER -->
            <div style="text-align: left; background: #18181b; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 14px; margin-top: 6px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
                    <label style="font-size: 11.5px; color: #38bdf8; font-weight: 700; display:flex; align-items:center; gap:6px;">
                        <i class="fa-solid fa-map-location-dot"></i> ASSIGNED TOLL PLAZA
                    </label>
                    <span id="plaza-count-badge" style="font-size: 9.5px; color: #38bdf8; font-weight: 700; background: rgba(56,189,248,0.12); padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(56,189,248,0.25);">Select Location</span>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;">
                    <div>
                        <label style="font-size: 9.5px; color: #cbd5e1; font-weight: 700; display: block; margin-bottom: 3px;">1. Select State</label>
                        <select id="toll-state-select" style="width: 100%; padding: 8px; background: #09090b; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px; color: #fff; font-size: 11.5px; font-weight: 600; outline: none; cursor: pointer;">
                            <option value="ALL">⭐ All States (India)</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size: 9.5px; color: #cbd5e1; font-weight: 700; display: block; margin-bottom: 3px;">2. Select District</label>
                        <select id="toll-district-select" style="width: 100%; padding: 8px; background: #09090b; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px; color: #fff; font-size: 11.5px; font-weight: 600; outline: none; cursor: pointer;">
                            <option value="ALL">All Districts</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label style="font-size: 9.5px; color: #cbd5e1; font-weight: 700; display: block; margin-bottom: 3px;">3. Choose Assigned Plaza</label>
                    <select id="admin-plaza" required style="width: 100%; padding: 9px 10px; background: #09090b; border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 6px; color: #f8fafc; font-size: 11.5px; font-weight: 600; outline: none; cursor: pointer;">
                        <option value="ALL">⭐ All Plazas (Super Admin - All India)</option>
                    </select>
                </div>

                <div id="district-tolls-card-list" class="district-tolls-card-list"></div>
            </div>

            <p id="login-error" style="color: #f87171; font-size: 11.5px; min-height: 16px; margin: 4px 0;"></p>

            <button type="submit" class="btn w-full" style="justify-content: center; padding: 12px; font-weight: 700; font-size: 13px; border-radius: 10px; background: #38bdf8; color: #09090b; border: none; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.background='#0ea5e9';" onmouseout="this.style.background='#38bdf8';">
                <i class="fa-solid fa-lock-open"></i> AUTHENTICATE & ENTER
            </button>
        </form>

        <div style="margin-top: 20px; font-size: 10.5px; color: #71717a;">
            <p><i class="fa-solid fa-shield-halved" style="color:#10b981;"></i> Protected by SNHOP Cryptographic Session Authentication.</p>
        </div>
        <a href="../index.html" style="display:inline-block; margin-top: 12px; font-size: 11.5px; color: #a1a1aa; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='#fff';" onmouseout="this.style.color='#a1a1aa';">← Back to Gateway</a>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/shared/utils.js"></script>
    <script src="../js/shared/storage.js"></script>
    <script src="../js/shared/indiaMapData.js"></script>
    <script src="../js/shared/tollSeedData.js"></script>
    <script src="../js/shared/tollData.js"></script>
    <script src="../js/shared/auth.js"></script>
    <script src="../js/admin/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js"></script>
    <script src="../js/shared/animations.js"></script>
</body>
</html>
