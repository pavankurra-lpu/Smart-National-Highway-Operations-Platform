<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Highway Route Not Found | SNHOP</title>
    <style>
        body, html {
            margin: 0; padding: 0; font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #0b0f17;
            color: #f8fafc; text-align: center; overflow: hidden;
        }
        .container {
            background: rgba(18, 24, 38, 0.9); padding: 48px 36px; border-radius: 20px;
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 540px; width: 90%;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
        }
        .error-badge {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            color: #f59e0b; background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 9999px;
            padding: 4px 12px; margin-bottom: 16px;
        }
        h1 { font-size: 72px; font-weight: 800; margin: 0 0 8px 0; color: #38bdf8; font-family: 'Space Grotesk', monospace; letter-spacing: -2px; }
        h2 { font-size: 20px; font-weight: 700; margin-bottom: 12px; color: #fff; }
        p { font-size: 14px; color: #94a3b8; margin-bottom: 32px; line-height: 1.6; }
        .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn {
            text-decoration: none; padding: 12px 24px; border-radius: 10px;
            font-weight: 700; font-size: 13px; transition: all 0.2s ease;
            display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
        }
        .btn-primary {
            background: #38bdf8; color: #0b0f17;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
        }
        .btn-primary:hover {
            background: #7dd3fc; transform: translateY(-2px);
        }
        .btn-outline {
            background: rgba(255, 255, 255, 0.05); color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1); color: #fff;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
    <div class="container">
        <div class="error-badge">
            <i class="fa-solid fa-triangle-exclamation"></i> SNHOP ROUTE EXCEPTION
        </div>
        <h1>404</h1>
        <h2>Highway Corridor Not Found</h2>
        <p>The requested national highway portal resource or corridor route does not exist or has been relocated.</p>
        
        <div class="btn-group">
            <a href="index.html" class="btn btn-primary" id="home-btn">
                <i class="fa-solid fa-house"></i> Main Gateway
            </a>
            <a href="user/index.html" class="btn btn-outline" id="user-btn">
                <i class="fa-solid fa-route"></i> Traveller Portal
            </a>
            <a href="admin/login.html" class="btn btn-outline" id="admin-btn">
                <i class="fa-solid fa-shield-halved"></i> Admin Portal
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const root = window.location.pathname.includes('/Smart-National-Highway-Operations-Platform/') 
                ? '/Smart-National-Highway-Operations-Platform/' 
                : '/';
            document.getElementById('home-btn').href = root + 'index.html';
            document.getElementById('user-btn').href = root + 'user/index.html';
            document.getElementById('admin-btn').href = root + 'admin/login.html';
        });
    </script>
</body>
</html>
